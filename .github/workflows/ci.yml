name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Motores en modo determinístico interno (sin proveedor externo, 15B).
          # Placeholders satisfy Next.js env reads if any.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Unit tests
        run: npm run test:unit

      # Playwright E2E is intentionally excluded from CI for now.
      # It requires a live Supabase project, demo seed, and secrets:
      #   E2E_BASE_URL, E2E_USER_EMAIL, E2E_USER_PASSWORD
      # Re-enable in a future phase once staging + GitHub secrets are configured.
